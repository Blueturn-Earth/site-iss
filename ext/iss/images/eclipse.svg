<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.3 -1.3 2.6 2.6" width="120" height="120">
  <!--
    The dot of a solar eclipse on the ISS globe (ext/iss/weather_dots.js loads only the <symbol> below).
    A dark moon over the sun, the corona a ring, a bead of light on its edge. Takes the color of `color` (currentColor).
  -->
  <defs>
    <symbol id="iss-weather-eclipse" viewBox="-1.3 -1.3 2.6 2.6" overflow="visible">
      <circle r="0.68" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="0.5"/>
      <circle r="0.68" fill="none" stroke="currentColor" stroke-width="0.24"/>
      <circle r="0.52" fill="#000" fill-opacity="0.9"/>
      <circle cx="0.5" cy="-0.5" r="0.2" fill="#000" fill-opacity="0.55"/>
      <circle cx="0.48" cy="-0.48" r="0.14" fill="currentColor"/>
    </symbol>
  </defs>
  <use href="#iss-weather-eclipse" style="color: #35b6ff"/>
</svg>
