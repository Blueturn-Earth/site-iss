<svg color="#fff" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clock face whose ring is the five age bands of the Sen clips, youngest first, clockwise from the top. Each arc takes
       its color from --age-band-N, set by the button from AGE_BANDS (sen/clip_age.js); the fallbacks are for browsing the file. -->
