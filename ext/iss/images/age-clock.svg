  <path d="M20.73 9.82A9 9 0 0 1 17.79 18.89" stroke="var(--age-band-1, #ff9500)" stroke-width="3" stroke-linecap="butt"/>
  <path d="M16.77 19.63A9 9 0 0 1 7.23 19.63" stroke="var(--age-band-2, #ffd60a)" stroke-width="3" stroke-linecap="butt"/>
  <path d="M6.21 18.89A9 9 0 0 1 3.27 9.82" stroke="var(--age-band-3, #ffffff)" stroke-width="3" stroke-linecap="butt"/>
  <path d="M3.66 8.63A9 9 0 0 1 11.37 3.02" stroke="var(--age-band-4, #8e8e93)" stroke-width="3" stroke-linecap="butt"/>
  <path d="M12 6.8V12L15.4 14.2" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
